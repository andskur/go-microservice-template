# Code generation for a shared protocols repository added under ./protocols
# with `make proto-setup` (git subtree). Run via `make generate-proto`.
#
# Managed mode rewrites go_package so the generated code belongs to this
# service's module and is imported as <module>/protocols/<path>, regardless of
# the go_package written in the shared .proto files. `make rename` updates the
# prefix below together with the module path.
version: v2
managed:
  enabled: true
  override:
    - file_option: go_package_prefix
      value: microservice-template/protocols
plugins:
  - local: protoc-gen-go
    out: protocols
    opt:
      - paths=source_relative
  - local: protoc-gen-go-grpc
    out: protocols
    opt:
      - paths=source_relative
