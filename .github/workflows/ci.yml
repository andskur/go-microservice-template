name: CI

on:
  pull_request:
  push:
    branches: ["main"]

permissions:
  contents: read

env:
  # Keep in sync with go.mod and the Dockerfile builder image.
  GO_VERSION: "1.26.11"

jobs:
  ci:
    name: Generate, lint, test, build, vulncheck
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version: ${{ env.GO_VERSION }}

      # Installs the pinned tools from the Makefile into ./bin and generates
      # protobuf (buf + local plugins) and swagger code.
      - name: Generate code
        run: make generate

      - name: Check go.mod/go.sum are tidy
        run: |
          go mod tidy
          git diff --exit-code go.mod go.sum

      - name: Validate Swagger spec
        run: make swagger-validate

      - name: Lint protobuf
        run: make buf-lint

      - name: Lint Go (golangci-lint, pinned)
        run: make lint

      - name: Test (race detector)
        run: make test

      - name: Build
        run: make build

      - name: Vulnerability check (govulncheck, pinned)
        run: make vuln

  docker:
    name: Docker build (no publish)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Build image
        run: docker build -t service:ci .

      - name: Smoke test /health
        run: |
          docker run -d --name svc -p 8080:8080 -e HTTP_ENABLED=true service:ci
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8080/health; then echo; exit 0; fi
            sleep 1
          done
          docker logs svc
          exit 1
